apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: healthcare-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Theodora2024/healthcare-gitops.git
    targetRevision: main
    path: overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: healthcare-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
